buildscript {
    project.ext['CERN_VM'] = System.getProperty('CERN_TECHNET_VM') ?: System.getenv('CERN_TECHNET_VM') ?: project.hasProperty('CERN_TECHNET_VM') ?: false
    project.ext['DEPLOYMENT'] = System.getProperty('DEPLOYMENT') ?: false

    repositories {
        if (project['CERN_VM']) {
            maven { url = 'https://artifactory.cern.ch/maven-central' }
            maven { url = 'https://artifactory.cern.ch/development' }
            maven { url = 'https://artifactory.cern.ch/gradle-plugins' }
        } else {
            gradlePluginPortal()
        }
    }

    dependencies {
        classpath 'com.github.jk1:gradle-license-report:3.1.5'
        classpath 'io.github.gradle-nexus:publish-plugin:2.0.0'
    }
}

apply plugin: 'java-library'
apply plugin: 'jacoco'
apply plugin: 'idea'
apply plugin: 'eclipse'

group = project['POM.groupId']

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

compileJava {
    options.release = 11
}

// JUnit 6 requires Java 17: tests are compiled for and run on 17+, while the library itself stays on Java 11
compileTestJava {
    options.release = 17
}

['testCompileClasspath', 'testRuntimeClasspath'].each { name ->
    configurations.named(name) {
        attributes { attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17) }
    }
}

repositories {
    if (project['CERN_VM']) {
        maven { url = 'https://artifactory.cern.ch/maven-central' }
        maven { url = 'https://artifactory.cern.ch/development' }
    } else {
        mavenCentral()
    }
}

dependencies {
    api 'org.jscience:jscience:4.3.1'
    api "com.google.guava:guava:${guavaVersion}"
    api 'org.hamcrest:hamcrest-library:3.0'
    api 'org.slf4j:slf4j-api:2.0.18'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.objenesis:objenesis:3.6'
    testImplementation 'com.openpojo:openpojo:0.9.1'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'nl.jqno.equalsverifier:equalsverifier:2.3.1'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.18'
}

wrapper {
    gradleVersion = '9.6.1'
    distributionType = Wrapper.DistributionType.ALL
}

sourceSets {
    main {
        java {
            srcDir 'src/java'
        }
    }
    test {
        java {
            srcDir 'src/test'
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events = ['passed', 'skipped', 'failed']
        exceptionFormat = 'full'
    }
}

jacocoTestReport {
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/report.xml')
        html.required = true
        csv.required = false
    }
}

javadoc { options.encoding = 'UTF-8' }

if(!project.tasks.findByName("javadocJar")) {
    tasks.register('javadocJar', Jar) {
        archiveClassifier = 'javadoc'
        from javadoc
    }
}

if(!project.tasks.findByName("sourcesJar")) {
    tasks.register('sourcesJar', Jar) {
        archiveClassifier = 'sources'
        from sourceSets.main.allSource
    }
}


eclipse {
    classpath {
        downloadJavadoc = true
        downloadSources = true
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

if (!project['CERN_VM']) {
    println 'Applying licensing report'
    apply plugin: 'com.github.jk1.dependency-license-report'

    licenseReport {
        renderers = [this.class.classLoader.loadClass('com.github.jk1.license.render.InventoryHtmlReportRenderer').newInstance()]
        filters = [this.class.classLoader.loadClass('com.github.jk1.license.filter.LicenseBundleNormalizer').newInstance()]
    }
}

if (project['DEPLOYMENT']) {
    println 'Applying deployment scripts'
    apply from: 'https://raw.githubusercontent.com/ossgang/gradle-scripts/master/deployment/deploy-to-maven-central.gradle'
}